# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Datasource
# Change username/password to match your local MySQL installation.
# The database "busticketdb" is created automatically if it does not exist.
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/busticketdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=(your password)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ddl-auto=update lets Hibernate create/update tables automatically from the entities.
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# Jackson (JSON date formatting)
# ==============================
spring.jackson.serialization.write-dates-as-timestamps=false


# Admin credentials. Override these with environment variables in production.
app.admin.username=${BUSGO_ADMIN_USERNAME:admin}
app.admin.password=${BUSGO_ADMIN_PASSWORD:Admin@123}
